# Staging-like stack (Postgres + API + Frontend)
# Usage:
#   cp .env.staging.example .env.staging
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up --build
#
# API: http://localhost:8000
# App: http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aibos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aibos_staging}
      POSTGRES_DB: ${POSTGRES_DB:-aibos}
    volumes:
      - aibos_pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aibos} -d ${POSTGRES_DB:-aibos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./ai-bos-backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: staging
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aibos}:${POSTGRES_PASSWORD:-aibos_staging}@db:5432/${POSTGRES_DB:-aibos}
      JWT_SECRET: ${JWT_SECRET:-staging-change-me-use-32-plus-bytes-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      STORAGE_LOCAL_PATH: /data/storage
      BACKUP_DIR: /data/backups
      CHATBOT_API_TOKEN: ${CHATBOT_API_TOKEN:-}
      EMAIL_MODE: ${EMAIL_MODE:-log}
    volumes:
      - aibos_storage:/data/storage
      - aibos_backups:/data/backups
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./ai-bos-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_USE_MOCKS: "false"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  aibos_pg_data:
  aibos_storage:
  aibos_backups:
