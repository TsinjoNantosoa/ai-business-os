name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aibos
          POSTGRES_PASSWORD: aibos
          POSTGRES_DB: aibos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aibos -d aibos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ai-bos-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-bos-backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./.ci_aibos.db
        run: python -m pytest -q --tb=line
      - name: Create non-superuser PostgreSQL application role
        env:
          PGPASSWORD: aibos
        run: |
          python - <<'PY'
          import psycopg2
          connection = psycopg2.connect("postgresql://aibos:aibos@localhost:5432/aibos_test")
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute("CREATE ROLE aibos_app LOGIN PASSWORD 'aibos_app'")
              cursor.execute("GRANT ALL PRIVILEGES ON DATABASE aibos_test TO aibos_app")
              cursor.execute("ALTER SCHEMA public OWNER TO aibos_app")
          connection.close()
          PY
      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg2://aibos_app:aibos_app@localhost:5432/aibos_test
        run: alembic upgrade head
      - name: Verify PostgreSQL RLS
        env:
          RLS_DATABASE_URL: postgresql+psycopg2://aibos_app:aibos_app@localhost:5432/aibos_test
        run: python -m pytest -q tests/test_postgres_rls.py --tb=line

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-bos-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ai-bos-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_USE_MOCKS: "false"
        run: npm run build
